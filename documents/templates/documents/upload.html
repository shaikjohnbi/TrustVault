
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Document | TrustVault</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        header {
            background: white;
            padding: 20px 6%;
            border-bottom: 1px solid #e5e9f2;
        }
        header a {
            color: #4f46e5;
            font-weight: 800;
            text-decoration: none;
            font-size: 23px;
        }
        main {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border: 1px solid #e5e9f2;
            border-radius: 16px;
        }
        h1 { margin-top: 0; }
        .muted { color: #687386; line-height: 1.6; }
        label {
            display: block;
            font-weight: 600;
            margin: 18px 0 7px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7ddeb;
            border-radius: 8px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: 0;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #3730a3; }
        .back { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <a href="/">TrustVault</a>
    </header>

    <main>
        <h1>Upload a document</h1>
        <p class="muted">
            Add a document to your workspace. Only authorized users
            should be able to upload or access private files.
        </p>

        <form action="/api/documents/upload/" method="post"
              enctype="multipart/form-data">
            {% csrf_token %}

            <label for="title">Document title</label>
            <input id="title" name="title" type="text"
                   maxlength="255" required>

            <label for="category">Category</label>
            <input id="category" name="category" type="text"
                   maxlength="100">

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      rows="4"></textarea>

            <label for="file">Choose file</label>
            <input id="file" name="file" type="file" required
                   accept=".pdf,.txt,.png,.jpg,.jpeg,.docx">

            <button type="submit">Upload document</button>
        </form>

        <p style="margin-top:24px">
            <a class="back" href="/">← Back to dashboard</a>
        </p>
    </main>
</body>
</html>
